command_timeout = 2000  # Fixes the Git timeout warning

"$schema" = 'https://starship.rs/config-schema.json'

# Format: Starting directly with the Directory 'Pill'
format = """
[](color_lavender)\
$directory\
[](fg:color_lavender) \
[](color_purple)\
$git_branch\
$git_status\
${custom.worktree}\
[](fg:color_purple) \
[](color_dev_bg)\
$rust\
$golang\
$nodejs\
$python\
[](fg:color_dev_bg) \
[](color_bg3)\
$time\
[](fg:color_bg3)\
$line_break$character"""

palette = 'ghostty_vibe'

[palettes.ghostty_vibe]
color_grey = '#1a1a1e'
color_lavender = '#9B96B5'
color_purple = '#6c629d'
color_dev_bg = '#3b4252'
color_bg3 = '#2e3440'

[directory]
style = "fg:color_grey bg:color_lavender"
format = "[ $path ]($style)"
# --- Path Tuning ---
truncation_length = 8      # Show up to 8 parent directories before shortening
truncate_to_repo = false   # Don't cut the path off just because you're in a Git repo
fish_style_pwd_dir_length = 3 # If it DOES truncate, show 3 chars (e.g., dev/pro/my-project)

[custom.worktree]
description = "Indicates when inside a git worktree"
command = 'echo "wt"'
when = 'git rev-parse --git-dir 2>/dev/null | grep -q "/worktrees/"'
style = "bg:color_purple fg:#f0c674"
format = '[ $output ]($style)'

[git_branch]
symbol = ""
style = "bg:color_purple fg:#ffffff"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:color_purple fg:#ffffff"
format = '[[($all_status$ahead_behind )](fg:#ffffff bg:color_purple)]($style)'

[rust]
symbol = " "
style = "bg:color_dev_bg fg:#ffa066"
format = '[$symbol($version )]($style)'

[python]
symbol = " "
style = "bg:color_dev_bg fg:#ebcb8b"
format = '[$symbol($version )]($style)'

[nodejs]
symbol = " " # This is the classic Node 'JS' symbol
style = "bg:color_dev_bg fg:#a3be8c" # A nice Node-green
format = '[$symbol($version )]($style)' # Removed the "via"

[time]
disabled = false
style = "bg:color_bg3 fg:#9B96B5"
format = '[  $time ]($style)'

[character]
#success_symbol = '[󰄵](bold color_lavender)'
#error_symbol = '[󰅙](bold red)'
success_symbol = '[󰄵](bold #9B96B5)'
vimcmd_symbol = '[󰄵](bold #6c629d)'
error_symbol = '[󰅙](bold red)'
