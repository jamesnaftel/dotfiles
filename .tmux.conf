# ==============================================================================
# TERMINAL & COLOR SETTINGS
# ==============================================================================
# Ghostty + RGB + Undercurl support
#set -g default-terminal "xterm-256color"
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ==============================================================================
# ERGONOMICS & GENERAL
# ==============================================================================
set -g base-index 1           # Start windows at 1
setw -g pane-base-index 1     # Start panes at 1
setw -g mouse on              # Enable mouse for scrolling/resizing
set -g history-limit 10000    # Increase scrollback buffer
set -g status-position bottom # Keep it at the bottom (or 'top' if preferred)
set -g repeat-time 1000       # Allow multiple commands after prefix (for resizing)
set-option -g focus-events on

# ==============================================================================
# KEYBINDINGS (Prefix is Ctrl-b via Moonlander Thumb Key)
# ==============================================================================
# Path-aware splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Rapid resizing (Hold Thumb-key prefix then tap keys)
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

# Helper to sync panes (type same command in all panes)
bind a set-window-option synchronize-panes

# Config Reload
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ==============================================================================
# COPY/PASTE (Cross-platform)
# ==============================================================================
setw -g mode-keys vi
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
if-shell "uname | grep -q Darwin" \
  "bind-key -Tcopy-mode-vi 'y' send -X copy-pipe-and-cancel 'pbcopy'" \
  "bind-key -Tcopy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -selection clipboard'"
bind-key -Tcopy-mode-vi Escape send -X cancel

# ==============================================================================
# GHOSTTY-OPTIMIZED STATUS BAR (Pills & Buttons)
# ==============================================================================
# Colors used:
# #9B96B5 (Lavender/Cursor)
# #1a1a1e (Dark Grey / Button Background)
# #ffffff (White / Pop Text)

# Main Bar: Transparent to show Ghostty blur
set -g status-style bg=default,fg="#9B96B5"
set -g status-left-length 30
set -g status-right-length 30

# LEFT: Session Name (Solid Pill)
set -g status-left "#[fg=#1a1a1e,bg=#9B96B5,bold]   #S #[default] "

# MIDDLE: Window List
set -g status-justify left
set-window-option -g window-status-separator " "

# INACTIVE Windows (Dimmed Button with Pop)
set-window-option -g window-status-format "#[fg=#9B96B5,bg=#1a1a1e] #I:#W #[default]"

# ACTIVE Window (High Contrast Pill)
set-window-option -g window-status-current-format "#[fg=#1a1a1e,bg=#9B96B5,bold] #I:#W* #[default]"

# RIGHT: Minimal Clock
set -g status-right "#[fg=#9B96B5,bg=default] %H:%M "

# Pane Borders (Clean & Subtle)
set-option -g pane-border-style fg="#1a1a1e"
set-option -g pane-active-border-style fg="#9B96B5"

# ==============================================================================
# TPM PLUGINS
# ==============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TPM (Keep this at the bottom)
run '~/.tmux/plugins/tpm/tpm'

